<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>html,body{margin:0;padding:0;width:512px;height:512px;overflow:hidden;}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18223d"/>
      <stop offset="55%" stop-color="#0d1119"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#f5b83d" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f5b83d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="55%" stop-color="#f5b83d"/>
      <stop offset="100%" stop-color="#c98a1e"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- 金色细边框 -->
  <rect x="7" y="7" width="498" height="498" rx="97" fill="none" stroke="#f5b83d" stroke-width="4" opacity="0.9"/>
  <!-- 光晕 -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- 奖杯（上移，为下方文字留空间） -->
  <g transform="translate(256,204)">
    <ellipse cx="0" cy="-70" rx="150" ry="110" fill="#f5b83d" opacity="0.12"/>
    <!-- 底座立柱 -->
    <rect x="-14" y="70" width="28" height="30" rx="4" fill="url(#gold)"/>
    <!-- 底座圆盘两层 -->
    <rect x="-58" y="96" width="116" height="13" rx="6.5" fill="url(#gold)"/>
    <rect x="-74" y="120" width="148" height="11" rx="5.5" fill="url(#gold)"/>
    <!-- 双耳 -->
    <path d="M-70 -58 C-116 -52 -116 2 -72 -10" fill="none" stroke="url(#gold)" stroke-width="17" stroke-linecap="round"/>
    <path d="M70 -58 C116 -52 116 2 72 -10" fill="none" stroke="url(#gold)" stroke-width="17" stroke-linecap="round"/>
    <!-- 杯口上缘 + 束腰横条 -->
    <rect x="-92" y="-92" width="184" height="16" rx="8" fill="url(#gold)"/>
    <rect x="-58" y="-40" width="116" height="8" rx="4" fill="url(#gold)" opacity="0.55"/>
    <!-- 杯身 -->
    <path d="M-70 -76 L70 -76 L54 62 Q0 90 -54 62 Z" fill="url(#gold)"/>
    <!-- 杯身高光 -->
    <path d="M-42 -68 L-24 -68 L-14 52 Q-30 60 -38 52 Z" fill="#ffffff" opacity="0.32"/>
  </g>

  <!-- 文字（移到奖杯底座下方，不重叠） -->
  <text x="256" y="388" text-anchor="middle"
        font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="52" font-weight="800" letter-spacing="2"
        fill="#f5b83d">LOL 赛事中心</text>
</svg>
</body>
</html>
