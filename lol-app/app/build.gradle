apply plugin: 'com.android.application'

// Release 签名：读取本地 key.properties（keystore 路径与密码，勿提交 git）
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('key.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.lplsched.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.lplsched.app"
        // 构建产物命名：release → LPL赛程-release.apk，debug → LPL赛程-debug.apk（APK 名统一为 LPL赛程）
        archivesName = "LPL赛程"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            // 交付 ABI：arm64-v8a（现代 ARM 真机）+ x86_64（保留通用性）
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path "src/main/CMakeLists.txt"
            version "3.22.1"
        }
    }
    ndkVersion "21.4.7075529"
    sourceSets {
        main {
            jniLibs.srcDirs 'src/main/libnode/bin/'
        }
    }
}

dependencies {
}
